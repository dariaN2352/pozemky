name: Pozemky – ráno a večer
on:
  schedule:
    # 8:00 a 17:30 slovenského času (GitHub beží v UTC, preto zimný a letný variant)
    - cron: "0 7 * 11,12,1,2,3 *"
    - cron: "30 16 * 11,12,1,2,3 *"
    - cron: "0 6 * 4-10 *"
    - cron: "30 15 * 4-10 *"
  workflow_dispatch:       # tlačidlo "Run workflow" na ručný test
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scraper.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAGES_URL: ${{ vars.PAGES_URL }}
      - name: Uložiť dáta
        run: |
          git config user.name "pozemky-bot"
          git config user.email "pozemky-bot@users.noreply.github.com"
          git add docs/listings.json docs/meta.json
          git commit -m "data $(date +%F_%H%M)" || echo "bez zmien"
          git push
